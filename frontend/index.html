<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sole Studio — Inventory Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    :root {
      --bg:           #09070f;
      --surface:      #13102a;
      --surface2:     #1c1840;
      --border:       #2d2050;
      --text:         #f0eaff;
      --muted:        #6b5d8a;
      --muted2:       #9d8dc0;
      --accent:       #7c3aed;
      --accent-light: #a78bfa;
      --danger:       #ef4444;
      --green:        #22c55e;
      --yellow:       #f59e0b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text); min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ══ NAVBAR ══ */
    .app-navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.9rem 0; box-shadow: 0 2px 24px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100; }
    .brand-pill { display: inline-flex; align-items: center; gap: 0.6rem; background: linear-gradient(135deg,#5b21b6,#7c3aed 60%,#a78bfa); border-radius: 12px; padding: 0.45rem 1rem 0.45rem 0.6rem; box-shadow: 0 0 18px rgba(124,58,237,0.35); }
    .brand-pill .icon-wrap { width:30px;height:30px;background:rgba(255,255,255,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.95rem;color:#fff;flex-shrink:0; }
    .brand-pill .b-name { font-size:1rem;font-weight:800;color:#fff;letter-spacing:0.01em;line-height:1; }
    .brand-pill .b-sub  { font-size:0.65rem;color:rgba(255,255,255,0.7);font-weight:500;letter-spacing:0.05em;text-transform:uppercase;line-height:1; }
    .nav-live { display:inline-flex;align-items:center;gap:0.4rem;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);border-radius:20px;padding:0.28rem 0.75rem;font-size:0.72rem;font-weight:600;color:#4ade80;letter-spacing:0.05em; }
    .nav-live .dot { width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

    /* ══ STAT CARDS ══ */
    .stat-card { background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent);border-radius:14px;padding:1.25rem 1.4rem;height:100%;position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s; }
    .stat-card::before { content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top left,rgba(124,58,237,.06),transparent 65%);pointer-events:none; }
    .stat-card:hover { box-shadow:0 0 0 1px var(--accent),0 0 28px rgba(124,58,237,.12);transform:translateY(-2px); }
    .stat-card.danger-card .stat-icon { background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.2);color:#f87171; }
    .stat-icon { width:40px;height:40px;border-radius:10px;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.25);display:flex;align-items:center;justify-content:center;font-size:1.05rem;color:var(--accent-light);margin-bottom:1rem; }
    .stat-label { font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);margin-bottom:.3rem; }
    .stat-value { font-size:2rem;font-weight:800;line-height:1;letter-spacing:-.02em; }
    .stat-value.danger-val { color:var(--danger); }
    .stat-sub { font-size:.72rem;color:var(--muted);margin-top:.3rem; }

    /* ══ PAGE LAYOUT ══ */
    .shop-layout { display:flex;gap:1.5rem;align-items:flex-start; }

    /* ══ FILTER SIDEBAR ══ */
    .filter-sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: sticky;
      top: 80px;
    }
    .filter-header { display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem;border-bottom:1px solid var(--border);background:var(--surface2); }
    .filter-title { font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:.4rem; }
    .filter-title i { color:var(--muted2); }
    .btn-clear-all { font-size:.72rem;font-weight:600;color:var(--accent-light);background:none;border:none;cursor:pointer;padding:0; }
    .btn-clear-all:hover { color:#fff; }

    .filter-section { border-bottom:1px solid var(--border); }
    .filter-section:last-child { border-bottom:none; }
    .filter-section-header {
      display:flex;align-items:center;justify-content:space-between;
      padding:.75rem 1.1rem;cursor:pointer;user-select:none;
      font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);
    }
    .filter-section-header:hover { color:var(--text); }
    .filter-section-header .chevron { transition:transform .2s;font-size:.7rem; }
    .filter-section-header.open .chevron { transform:rotate(180deg); }
    .filter-section-body { padding:.5rem 1.1rem .9rem; }

    /* Brand checkboxes */
    .brand-check { display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.3rem 0;cursor:pointer; }
    .brand-check input { display:none; }
    .brand-check-box { width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s; }
    .brand-check input:checked ~ .brand-check-box { background:var(--accent);border-color:var(--accent); }
    .brand-check input:checked ~ .brand-check-box::after { content:'✓';font-size:.65rem;color:#fff;font-weight:700; }
    .brand-check-label { font-size:.8rem;color:var(--text);flex:1; }
    .brand-check-count { font-size:.7rem;color:var(--muted);background:var(--surface2);border-radius:10px;padding:.05rem .4rem; }

    /* Size grid */
    .size-grid { display:flex;flex-wrap:wrap;gap:.35rem; }
    .size-btn { width:38px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted2);font-size:.72rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center; }
    .size-btn:hover { border-color:var(--accent-light);color:var(--text); }
    .size-btn.active { background:var(--accent);border-color:var(--accent);color:#fff; }

    /* Gender pills */
    .gender-pills { display:flex;flex-wrap:wrap;gap:.35rem; }
    .gender-pill { padding:.28rem .7rem;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted2);font-size:.75rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s; }
    .gender-pill:hover { border-color:var(--accent-light);color:var(--text); }
    .gender-pill.active { background:var(--accent);border-color:var(--accent);color:#fff; }

    /* Price range */
    .price-inputs { display:flex;align-items:center;gap:.5rem; }
    .price-field { width:100%;padding:.4rem .6rem;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.8rem;font-family:inherit;outline:none; }
    .price-field:focus { border-color:var(--accent); }
    .price-sep { color:var(--muted);font-size:.8rem;flex-shrink:0; }

    /* Active filter chips */
    .filter-chips { display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem; }
    .filter-chip { display:inline-flex;align-items:center;gap:.3rem;background:rgba(124,58,237,.15);color:var(--accent-light);border:1px solid rgba(124,58,237,.3);border-radius:20px;padding:.18rem .6rem;font-size:.72rem;font-weight:600; }
    .filter-chip button { background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:.7rem;line-height:1;opacity:.7; }
    .filter-chip button:hover { opacity:1; }

    /* ══ PRODUCT AREA ══ */
    .product-area { flex:1;min-width:0; }
    .product-toolbar { display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap; }
    .results-count { font-size:.85rem;color:var(--muted2); }
    .results-count strong { color:var(--text); }
    .toolbar-right { display:flex;align-items:center;gap:.6rem;flex-wrap:wrap; }

    .search-wrap { position:relative;min-width:200px; }
    .search-wrap .si { position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.82rem;pointer-events:none; }
    #searchInput { width:100%;padding:.5rem .85rem .5rem 2.2rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s; }
    #searchInput::placeholder { color:var(--muted); }
    #searchInput:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.18); }

    .btn-add-toggle { display:inline-flex;align-items:center;gap:.45rem;background:rgba(124,58,237,.12);color:var(--accent-light);border:1px solid rgba(124,58,237,.35);border-left:3px solid var(--accent);border-radius:8px;padding:.48rem 1rem .48rem .85rem;font-size:.82rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap; }
    .btn-add-toggle:hover { background:rgba(124,58,237,.22);color:#fff; }
    .btn-add-toggle .ti { transition:transform .25s; }
    .btn-add-toggle.open .ti { transform:rotate(45deg); }

    /* ══ ADD FORM ══ */
    .add-form-card { background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;overflow:hidden; }
    .add-form-body { padding:1.25rem; }
    .form-label-sm { display:block;font-size:.7rem;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem; }
    .form-field { width:100%;padding:.5rem .8rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.875rem;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s; }
    .form-field::placeholder { color:var(--muted); }
    .form-field:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.18); }
    .form-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem; }
    .form-actions { display:flex;align-items:center;gap:.6rem;margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--border); }
    .btn-submit { display:inline-flex;align-items:center;gap:.4rem;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:.55rem 1.3rem;font-size:.875rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s; }
    .btn-submit:hover { background:#6d28d9; }
    .btn-cancel-sm { display:inline-flex;align-items:center;background:transparent;color:var(--muted2);border:1px solid var(--border);border-radius:8px;padding:.55rem 1.1rem;font-size:.875rem;font-family:inherit;cursor:pointer;transition:all .15s; }
    .btn-cancel-sm:hover { background:var(--surface2);color:var(--text); }

    /* ══ PRODUCT GRID ══ */
    .product-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.1rem; }

    .product-card { background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative; }
    .product-card:hover { transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 0 1px var(--accent);border-color:var(--accent); }

    .product-img-wrap { position:relative;width:100%;aspect-ratio:4/3;background:#0f0d1f;overflow:hidden; }
    .product-img-wrap img { width:100%;height:100%;object-fit:cover;transition:transform .35s; }
    .product-card:hover .product-img-wrap img { transform:scale(1.06); }

    .stock-ribbon { position:absolute;top:.65rem;right:.65rem;border-radius:20px;padding:.18rem .55rem;font-size:.65rem;font-weight:700;display:flex;align-items:center;gap:.25rem; }
    .stock-ribbon .dot { width:5px;height:5px;border-radius:50%;background:currentColor; }
    .stock-ribbon.green  { background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3); }
    .stock-ribbon.yellow { background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3); }
    .stock-ribbon.red    { background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3); }

    .product-actions { position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(9,7,15,.9),transparent);padding:2.5rem .75rem .65rem;display:flex;gap:.4rem;opacity:0;transition:opacity .2s; }
    .product-card:hover .product-actions { opacity:1; }
    .btn-edit,.btn-del { flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.25rem;border-radius:7px;padding:.38rem 0;font-size:.72rem;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all .15s; }
    .btn-edit { background:rgba(124,58,237,.2);color:var(--accent-light);border-color:rgba(124,58,237,.4); }
    .btn-edit:hover { background:rgba(124,58,237,.35); }
    .btn-del  { background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.3); }
    .btn-del:hover  { background:rgba(239,68,68,.25); }

    .product-body { padding:.85rem .9rem 1rem; }
    .product-brand { display:inline-block;background:rgba(124,58,237,.12);color:var(--accent-light);border:1px solid rgba(124,58,237,.22);border-radius:6px;padding:.12rem .45rem;font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:.35rem; }
    .product-name { font-size:.95rem;font-weight:700;line-height:1.2;margin-bottom:.28rem; }
    .product-meta { font-size:.72rem;color:var(--muted2);margin-bottom:.65rem; }
    .product-footer { display:flex;align-items:center;justify-content:space-between; }
    .product-price { font-size:1.05rem;font-weight:800;color:var(--accent-light); }
    .qty-badge { display:inline-flex;align-items:center;gap:.25rem;border-radius:20px;padding:.18rem .55rem;font-size:.7rem;font-weight:700; }
    .qty-red    { background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25); }
    .qty-yellow { background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.25); }
    .qty-green  { background:rgba(34,197,94,.10);color:#4ade80;border:1px solid rgba(34,197,94,.22); }

    .img-placeholder { width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:.4rem; }
    .img-placeholder i { font-size:2rem;opacity:.25; }

    /* ══ VIEW TOGGLE ══ */
    .view-toggle { display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden; }
    .view-btn { width:34px;height:34px;background:var(--surface);border:none;color:var(--muted2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:all .15s; }
    .view-btn:hover { color:var(--text);background:var(--surface2); }
    .view-btn.active { background:rgba(124,58,237,.2);color:var(--accent-light); }

    /* ══ INVENTORY TABLE ══ */
    .inv-table { border-collapse:collapse;width:100%; }
    .inv-table th { background:var(--surface2);color:var(--muted2);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:.65rem .9rem;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap; }
    .inv-table th:hover { color:var(--text); }
    .inv-table td { padding:.6rem .9rem;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle; }
    .inv-table tbody tr:hover td { background:var(--surface2);cursor:pointer; }
    .sort-arrow { font-size:.7rem;margin-left:.25rem;color:var(--accent-light); }

    /* ══ EMPTY STATE ══ */
    .empty-state { grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted); }
    .empty-state i { font-size:3rem;opacity:.25;display:block;margin-bottom:.75rem; }
    .empty-state p { font-size:.875rem;margin:0; }

    /* ══ MODALS ══ */
    .modal-content { background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.7); }
    .modal-header { background:var(--surface2);border-bottom:1px solid var(--border);border-radius:16px 16px 0 0;padding:1rem 1.4rem; }
    .modal-title { font-size:.9rem;font-weight:700; }
    .modal-header .btn-close { filter:invert(1) brightness(.6);opacity:.6; }
    .modal-header .btn-close:hover { opacity:1; }
    .modal-body { padding:1.4rem; }
    .modal-footer { border-top:1px solid var(--border);padding:.9rem 1.4rem;display:flex;gap:.5rem;justify-content:flex-end; }
    .btn-save { display:inline-flex;align-items:center;gap:.35rem;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:.5rem 1.3rem;font-size:.875rem;font-weight:600;font-family:inherit;cursor:pointer; }
    .btn-save:hover { background:#6d28d9; }
    .btn-cancel { display:inline-flex;align-items:center;background:transparent;color:var(--muted2);border:1px solid var(--border);border-radius:8px;padding:.5rem 1.1rem;font-size:.875rem;font-family:inherit;cursor:pointer; }
    .btn-cancel:hover { background:var(--surface2);color:var(--text); }

    /* Product detail modal */
    #productModal .modal-dialog { max-width:820px; }
    #productModal .modal-content { border-radius:20px;overflow:hidden; }
    .detail-img-col { background:#0f0d1f;display:flex;align-items:center;justify-content:center;min-height:360px;padding:0; }
    .detail-img-col img { width:100%;height:100%;object-fit:cover;max-height:420px; }
    .detail-img-ph { display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:360px;color:var(--muted); }
    .detail-img-ph i { font-size:4rem;opacity:.2; }
    .detail-info { padding:2rem 1.75rem;display:flex;flex-direction:column; }
    .detail-brand { font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-light);margin-bottom:.4rem; }
    .detail-name  { font-size:1.6rem;font-weight:800;line-height:1.15;margin-bottom:1rem; }
    .detail-price { font-size:1.4rem;font-weight:800;color:var(--accent-light);margin-bottom:1.4rem; }
    .detail-specs { display:flex;flex-direction:column;gap:0;margin-bottom:1.5rem; }
    .detail-spec-row { display:flex;justify-content:space-between;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--border);font-size:.875rem; }
    .detail-spec-row:last-child { border-bottom:none; }
    .detail-spec-label { color:var(--muted2);font-weight:500; }
    .detail-spec-val { font-weight:600; }
    .detail-actions { display:flex;gap:.75rem;margin-top:auto;padding-top:1rem; }
    .btn-detail-edit { flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:.75rem;font-size:.875rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s; }
    .btn-detail-edit:hover { background:#6d28d9; }
    .btn-detail-del { display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:.75rem 1.1rem;font-size:.875rem;font-weight:600;font-family:inherit;cursor:pointer; }
    .btn-detail-del:hover { background:rgba(239,68,68,.22); }

    /* ══ FOOTER ══ */
    .app-footer { text-align:center;padding:2rem 0 1.5rem;font-size:.75rem;color:var(--muted); }

    /* ══ RESPONSIVE ══ */
    @media (max-width:768px) {
      .shop-layout { flex-direction:column; }
      .filter-sidebar { width:100%;position:static; }
      .product-grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
    }
    @media (max-width:576px) {
      .stat-value { font-size:1.5rem; }
      .form-grid { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="app-navbar mb-4">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="brand-pill text-decoration-none" href="#">
      <span class="icon-wrap"><i class="bi bi-bag-heart-fill"></i></span>
      <span><div class="b-name">Sole Studio</div><div class="b-sub">Inventory Management</div></span>
    </a>
    <span class="nav-live d-none d-sm-inline-flex"><span class="dot"></span>Live</span>
  </div>
</nav>

<div class="container pb-5">

  <!-- STAT CARDS -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <div class="stat-icon"><i class="bi bi-grid-3x3-gap-fill"></i></div>
        <div class="stat-label">Total SKUs</div>
        <div class="stat-value" id="statSkus">—</div>
        <div class="stat-sub">Unique items</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <div class="stat-icon"><i class="bi bi-layers-fill"></i></div>
        <div class="stat-label">Total Units</div>
        <div class="stat-value" id="statUnits">—</div>
        <div class="stat-sub">Units in stock</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <div class="stat-icon"><i class="bi bi-currency-dollar"></i></div>
        <div class="stat-label">Total Value</div>
        <div class="stat-value" id="statValue">—</div>
        <div class="stat-sub">Total retail value</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="stat-card" id="lowStockCard">
        <div class="stat-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <div class="stat-label">Low Stock</div>
        <div class="stat-value" id="statLow">—</div>
        <div class="stat-sub">Items with qty &lt; 5</div>
      </div>
    </div>
  </div>

  <!-- SHOP LAYOUT -->
  <div class="shop-layout">

    <!-- FILTER SIDEBAR -->
    <aside class="filter-sidebar">
      <div class="filter-header">
        <span class="filter-title"><i class="bi bi-sliders"></i> Refine Results</span>
        <button class="btn-clear-all" onclick="clearAllFilters()">Clear all</button>
      </div>

      <!-- Gender -->
      <div class="filter-section">
        <div class="filter-section-header open" onclick="toggleSection(this)">
          Gender <i class="bi bi-chevron-down chevron"></i>
        </div>
        <div class="filter-section-body">
          <div class="gender-pills">
            <button class="gender-pill active" data-gender="" onclick="setGender(this.dataset.gender,this)">All</button>
            <button class="gender-pill" data-gender="Men's" onclick="setGender(this.dataset.gender,this)">Men's</button>
            <button class="gender-pill" data-gender="Women's" onclick="setGender(this.dataset.gender,this)">Women's</button>
            <button class="gender-pill" data-gender="Kids'" onclick="setGender(this.dataset.gender,this)">Kids'</button>
          </div>
        </div>
      </div>

      <!-- Brand -->
      <div class="filter-section">
        <div class="filter-section-header open" onclick="toggleSection(this)">
          Brand <i class="bi bi-chevron-down chevron"></i>
        </div>
        <div class="filter-section-body" id="brandFilterBody"></div>
      </div>

      <!-- Size -->
      <div class="filter-section">
        <div class="filter-section-header open" onclick="toggleSection(this)">
          Size <i class="bi bi-chevron-down chevron"></i>
        </div>
        <div class="filter-section-body" id="sizeFilterBody"></div>
      </div>

      <!-- Price -->
      <div class="filter-section">
        <div class="filter-section-header open" onclick="toggleSection(this)">
          Price <i class="bi bi-chevron-down chevron"></i>
        </div>
        <div class="filter-section-body">
          <div class="price-inputs">
            <input class="price-field" type="number" id="priceMin" placeholder="Min" min="0" oninput="applyFilters()"/>
            <span class="price-sep">—</span>
            <input class="price-field" type="number" id="priceMax" placeholder="Max" min="0" oninput="applyFilters()"/>
          </div>
        </div>
      </div>
    </aside>

    <!-- PRODUCT AREA -->
    <div class="product-area">

      <!-- Toolbar -->
      <div class="product-toolbar">
        <div>
          <div id="filterChips" class="filter-chips"></div>
          <span class="results-count"><strong id="resultCount">0</strong> items</span>
        </div>
        <div class="toolbar-right">
          <div class="view-toggle">
            <button class="view-btn active" id="viewCardBtn" onclick="setView('card')" title="Card view"><i class="bi bi-grid-3x3-gap-fill"></i></button>
            <button class="view-btn" id="viewTableBtn" onclick="setView('table')" title="Table view"><i class="bi bi-table"></i></button>
          </div>
          <div class="search-wrap">
            <i class="bi bi-search si"></i>
            <input type="search" id="searchInput" placeholder="Search name or brand…" oninput="applyFilters()"/>
          </div>
          <button class="btn-add-toggle" id="addToggleBtn" onclick="toggleAddForm()">
            <i class="bi bi-plus-lg ti"></i> Add Shoe
          </button>
        </div>
      </div>

      <!-- Add Form -->
      <div class="collapse" id="addFormCollapse">
        <div class="add-form-card">
          <div class="add-form-body">
            <form id="addForm">
              <div class="form-grid">
                <div><label class="form-label-sm">Shoe Name</label><input class="form-field" id="fname" placeholder="e.g. Air Max 90" required/></div>
                <div><label class="form-label-sm">Brand</label><input class="form-field" id="fbrand" placeholder="e.g. Nike" required/></div>
                <div><label class="form-label-sm">Size</label><input class="form-field" id="fsize" type="number" step="0.5" placeholder="10" required/></div>
                <div><label class="form-label-sm">Color</label><input class="form-field" id="fcolor" placeholder="e.g. White" required/></div>
                <div><label class="form-label-sm">Price ($)</label><input class="form-field" id="fprice" type="number" step="0.01" placeholder="0.00" required/></div>
                <div><label class="form-label-sm">Quantity</label><input class="form-field" id="fqty" type="number" min="0" placeholder="0" required/></div>
                <div><label class="form-label-sm">Gender</label>
                  <select class="form-field" id="fgender" required>
                    <option value="">Select…</option>
                    <option value="Men's">Men's</option>
                    <option value="Women's">Women's</option>
                    <option value="Kids'">Kids'</option>
                  </select>
                </div>
              </div>
              <div class="form-actions">
                <button class="btn-submit" type="submit"><i class="bi bi-plus-circle-fill"></i> Add to Inventory</button>
                <button class="btn-cancel-sm" type="button" onclick="closeAddForm()">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Product Grid -->
      <div class="product-grid" id="productGrid"></div>
      <div id="productTable" style="display:none;overflow-x:auto;"></div>

    </div><!-- /product-area -->
  </div><!-- /shop-layout -->
</div>

<footer class="app-footer">Sole Studio Inventory &nbsp;·&nbsp; Flask + MongoDB</footer>

<!-- PRODUCT DETAIL MODAL -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="filter:invert(1) brightness(.7);z-index:10;"></button>
      <div class="row g-0" style="min-height:420px;">
        <div class="col-md-5 detail-img-col" id="detailImgCol"></div>
        <div class="col-md-7 detail-info">
          <div class="detail-brand" id="detailBrand"></div>
          <div class="detail-name"  id="detailName"></div>
          <div class="detail-price" id="detailPrice"></div>
          <div class="detail-specs">
            <div class="detail-spec-row"><span class="detail-spec-label">Size</span><span class="detail-spec-val" id="detailSize"></span></div>
            <div class="detail-spec-row"><span class="detail-spec-label">Color</span><span class="detail-spec-val" id="detailColor"></span></div>
            <div class="detail-spec-row"><span class="detail-spec-label">Gender</span><span class="detail-spec-val" id="detailGender"></span></div>
            <div class="detail-spec-row"><span class="detail-spec-label">Stock</span><span class="detail-spec-val" id="detailStock"></span></div>
          </div>
          <div class="detail-actions">
            <button class="btn-detail-edit" id="detailEditBtn"><i class="bi bi-pencil-fill"></i> Edit Quantity</button>
            <button class="btn-detail-del"  id="detailDelBtn"><i class="bi bi-trash3-fill"></i> Remove</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- EDIT QTY MODAL -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pencil-fill me-2" style="color:var(--accent-light)"></i>Update Quantity</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label-sm">New Quantity</label>
        <input type="number" id="newQty" class="form-field" min="0" placeholder="Enter quantity"/>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-save" onclick="saveQty()"><i class="bi bi-check2"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API = "http://localhost:5050";
  let editingId = null;
  let allItems  = [];
  const editModal    = new bootstrap.Modal(document.getElementById("editModal"));
  const productModal = new bootstrap.Modal(document.getElementById("productModal"));

  // Active filters
  const filters = { brands: new Set(), sizes: new Set(), minPrice: null, maxPrice: null, search: "", gender: "" };
  let viewMode = 'card';
  let sortCol  = null;
  let sortDir  = 'asc';

  /* ─── Stats ─── */
  function updateStats(items) {
    const skus  = items.length;
    const units = items.reduce((s,i) => s + (i.quantity||0), 0);
    const val   = items.reduce((s,i) => s + (i.quantity||0) * parseFloat(i.price||0), 0);
    const low   = items.filter(i => (i.quantity||0) < 5).length;
    document.getElementById("statSkus").textContent  = skus.toLocaleString();
    document.getElementById("statUnits").textContent = units.toLocaleString();
    document.getElementById("statValue").textContent = "$" + val.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    document.getElementById("statLow").textContent   = low.toLocaleString();
    const lowEl = document.getElementById("statLow"), lowCard = document.getElementById("lowStockCard");
    if (low > 0) { lowEl.classList.add("danger-val"); lowCard.classList.add("danger-card"); lowCard.style.borderTopColor="var(--danger)"; }
    else         { lowEl.classList.remove("danger-val"); lowCard.classList.remove("danger-card"); lowCard.style.borderTopColor=""; }
  }

  /* ─── Build filter sidebar ─── */
  function buildFilters(items) {
    // Brands
    const brandCounts = {};
    items.forEach(i => brandCounts[i.brand] = (brandCounts[i.brand]||0) + 1);
    const brandBody = document.getElementById("brandFilterBody");
    brandBody.innerHTML = Object.entries(brandCounts).sort((a,b)=>a[0].localeCompare(b[0])).map(([brand, count]) => `
      <label class="brand-check">
        <input type="checkbox" value="${escHtml(brand)}" onchange="toggleBrandFilter(this)" ${filters.brands.has(brand)?'checked':''}/>
        <span class="brand-check-box"></span>
        <span class="brand-check-label">${escHtml(brand)}</span>
        <span class="brand-check-count">${count}</span>
      </label>`).join("");

    // Sizes
    const sizes = [...new Set(items.map(i => i.size))].sort((a,b) => a-b);
    const sizeBody = document.getElementById("sizeFilterBody");
    sizeBody.innerHTML = `<div class="size-grid">${sizes.map(s =>
      `<button class="size-btn ${filters.sizes.has(s)?'active':''}" onclick="toggleSizeFilter(${s},this)">${s}</button>`
    ).join("")}</div>`;
  }

  /* ─── Filter toggles ─── */
  function toggleBrandFilter(cb) {
    if (cb.checked) filters.brands.add(cb.value); else filters.brands.delete(cb.value);
    applyFilters();
  }
  function toggleSizeFilter(size, btn) {
    if (filters.sizes.has(size)) { filters.sizes.delete(size); btn.classList.remove("active"); }
    else { filters.sizes.add(size); btn.classList.add("active"); }
    applyFilters();
  }
  function clearAllFilters() {
    filters.brands.clear(); filters.sizes.clear(); filters.minPrice = null; filters.maxPrice = null;
    document.getElementById("priceMin").value = "";
    document.getElementById("priceMax").value = "";
    document.getElementById("searchInput").value = "";
    filters.gender = '';
    document.querySelectorAll('.gender-pill').forEach(p => p.classList.toggle('active', p.dataset.gender === ''));
    buildFilters(allItems);
    applyFilters();
  }

  function setView(mode) {
    viewMode = mode;
    document.getElementById('viewCardBtn').classList.toggle('active', mode === 'card');
    document.getElementById('viewTableBtn').classList.toggle('active', mode === 'table');
    document.getElementById('productGrid').style.display  = mode === 'card'  ? '' : 'none';
    document.getElementById('productTable').style.display = mode === 'table' ? '' : 'none';
    applyFilters();
  }

  function sortTable(col) {
    if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortCol = col; sortDir = 'asc'; }
    applyFilters();
  }

  function renderTable(items) {
    const container = document.getElementById("productTable");
    document.getElementById("resultCount").textContent = items.length;
    if (!items.length) {
      container.innerHTML = `<div class="empty-state"><i class="bi bi-bag-x"></i><p>No items match your filters.</p></div>`;
      return;
    }

    const cols   = ['brand','name','gender','size','color','price','quantity'];
    const labels = { brand:'Brand', name:'Name', gender:'Gender', size:'Size', color:'Color', price:'Price', quantity:'Stock' };

    let sorted = [...items];
    if (sortCol) {
      sorted.sort((a, b) => {
        let av = a[sortCol], bv = b[sortCol];
        if (typeof av === 'string') av = av.toLowerCase();
        if (typeof bv === 'string') bv = bv.toLowerCase();
        if (av < bv) return sortDir === 'asc' ? -1 : 1;
        if (av > bv) return sortDir === 'asc' ?  1 : -1;
        return 0;
      });
    }

    const thead = cols.map(col => {
      const arrow = sortCol === col ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '';
      return `<th onclick="sortTable('${col}')">${labels[col]}<span class="sort-arrow">${arrow}</span></th>`;
    }).join('') + '<th>Actions</th>';

    const tbody = sorted.map(item => `
      <tr onclick="openProduct('${item._id}')">
        <td><span class="product-brand">${escHtml(item.brand)}</span></td>
        <td style="font-weight:600">${escHtml(item.name)}</td>
        <td style="color:var(--muted2)">${escHtml(item.gender || '—')}</td>
        <td>${item.size}</td>
        <td style="color:var(--muted2)">${escHtml(item.color)}</td>
        <td style="color:var(--accent-light);font-weight:700">$${parseFloat(item.price).toFixed(2)}</td>
        <td onclick="event.stopPropagation();openEdit('${item._id}',${item.quantity})">${qtyBadge(item.quantity)}</td>
        <td onclick="event.stopPropagation()">
          <button class="btn-del" style="width:auto;padding:.3rem .6rem" onclick="deleteItem('${item._id}')">
            <i class="bi bi-trash3-fill"></i>
          </button>
        </td>
      </tr>`).join('');

    container.innerHTML = `
      <table class="inv-table">
        <thead><tr>${thead}</tr></thead>
        <tbody>${tbody}</tbody>
      </table>`;
  }

  function setGender(val, btn) {
    filters.gender = val;
    document.querySelectorAll('.gender-pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  /* ─── Apply all filters ─── */
  function applyFilters() {
    filters.search   = document.getElementById("searchInput").value.trim().toLowerCase();
    filters.minPrice = parseFloat(document.getElementById("priceMin").value) || null;
    filters.maxPrice = parseFloat(document.getElementById("priceMax").value) || null;

    let result = allItems;
    if (filters.brands.size) result = result.filter(i => filters.brands.has(i.brand));
    if (filters.sizes.size)  result = result.filter(i => filters.sizes.has(i.size));
    if (filters.minPrice)    result = result.filter(i => parseFloat(i.price) >= filters.minPrice);
    if (filters.maxPrice)    result = result.filter(i => parseFloat(i.price) <= filters.maxPrice);
    if (filters.search)      result = result.filter(i => i.name.toLowerCase().includes(filters.search) || i.brand.toLowerCase().includes(filters.search));
    if (filters.gender)      result = result.filter(i => i.gender === filters.gender);

    if (viewMode === 'table') renderTable(result);
    else renderCards(result);
    renderChips();
  }

  /* ─── Filter chips ─── */
  function renderChips() {
    const chips = [];
    filters.brands.forEach(b => chips.push(`<span class="filter-chip">${escHtml(b)}<button onclick="removeChip('brand','${escHtml(b)}')">✕</button></span>`));
    filters.sizes.forEach(s  => chips.push(`<span class="filter-chip">Size ${s}<button onclick="removeChip('size',${s})">✕</button></span>`));
    if (filters.minPrice) chips.push(`<span class="filter-chip">Min $${filters.minPrice}<button onclick="removeChip('minPrice')">✕</button></span>`);
    if (filters.maxPrice) chips.push(`<span class="filter-chip">Max $${filters.maxPrice}<button onclick="removeChip('maxPrice')">✕</button></span>`);
    if (filters.gender)   chips.push(`<span class="filter-chip">${escHtml(filters.gender)}<button onclick="removeChip('gender')">✕</button></span>`);
    document.getElementById("filterChips").innerHTML = chips.join("");
  }
  function removeChip(type, val) {
    if (type === 'brand') { filters.brands.delete(val); buildFilters(allItems); }
    else if (type === 'size') { filters.sizes.delete(val); buildFilters(allItems); }
    else if (type === 'minPrice') { filters.minPrice=null; document.getElementById("priceMin").value=""; }
    else if (type === 'maxPrice') { filters.maxPrice=null; document.getElementById("priceMax").value=""; }
    else if (type === 'gender')   { filters.gender=''; document.querySelectorAll('.gender-pill').forEach(p => p.classList.toggle('active', p.dataset.gender === '')); }
    applyFilters();
  }

  /* ─── Render cards ─── */
  function stockRibbon(qty) {
    if (qty < 5)  return `<span class="stock-ribbon red"><span class="dot"></span>Critical</span>`;
    if (qty < 10) return `<span class="stock-ribbon yellow"><span class="dot"></span>Low</span>`;
    return              `<span class="stock-ribbon green"><span class="dot"></span>In Stock</span>`;
  }
  function qtyBadge(qty) {
    if (qty < 5)  return `<span class="qty-badge qty-red"><i class="bi bi-exclamation-circle-fill"></i>${qty}</span>`;
    if (qty < 10) return `<span class="qty-badge qty-yellow"><i class="bi bi-dash-circle-fill"></i>${qty}</span>`;
    return              `<span class="qty-badge qty-green"><i class="bi bi-check-circle-fill"></i>${qty}</span>`;
  }

  function renderCards(items) {
    const grid = document.getElementById("productGrid");
    document.getElementById("resultCount").textContent = items.length;
    if (!items.length) {
      grid.innerHTML = `<div class="empty-state"><i class="bi bi-bag-x"></i><p>No items match your filters.</p></div>`;
      return;
    }
    grid.innerHTML = items.map(item => {
      const imgHtml = item.image
        ? `<img src="${escHtml(item.image)}" alt="${escHtml(item.name)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'img-placeholder\\'><i class=\\'bi bi-image\\'></i></div>'">`
        : `<div class="img-placeholder"><i class="bi bi-image"></i></div>`;
      return `
        <div class="product-card" onclick="openProduct('${item._id}')">
          <div class="product-img-wrap">
            ${imgHtml}
            ${stockRibbon(item.quantity)}
            <div class="product-actions">
              <button class="btn-edit" onclick="event.stopPropagation();openEdit('${item._id}',${item.quantity})"><i class="bi bi-pencil-fill"></i> Edit Qty</button>
              <button class="btn-del"  onclick="event.stopPropagation();deleteItem('${item._id}')"><i class="bi bi-trash3-fill"></i> Remove</button>
            </div>
          </div>
          <div class="product-body">
            <div class="product-brand">${escHtml(item.brand)}</div>
            <div class="product-name">${escHtml(item.name)}</div>
            <div class="product-meta">Size ${item.size} &nbsp;·&nbsp; ${escHtml(item.color)}</div>
            <div class="product-footer">
              <span class="product-price">$${parseFloat(item.price).toFixed(2)}</span>
              ${qtyBadge(item.quantity)}
            </div>
          </div>
        </div>`;
    }).join("");
  }

  /* ─── Load inventory ─── */
  async function loadInventory() {
    const items = await fetch(`${API}/inventory`).then(r => r.json());
    allItems = items;
    updateStats(items);
    buildFilters(items);
    applyFilters();
  }

  /* ─── Add form ─── */
  function toggleAddForm() {
    const el = document.getElementById("addFormCollapse"), btn = document.getElementById("addToggleBtn");
    bootstrap.Collapse.getOrCreateInstance(el).toggle();
    btn.classList.toggle("open");
  }
  function closeAddForm() {
    bootstrap.Collapse.getOrCreateInstance(document.getElementById("addFormCollapse")).hide();
    document.getElementById("addToggleBtn").classList.remove("open");
  }
  document.getElementById("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    await fetch(`${API}/inventory`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        name:     document.getElementById("fname").value,
        brand:    document.getElementById("fbrand").value,
        size:     parseFloat(document.getElementById("fsize").value),
        color:    document.getElementById("fcolor").value,
        price:    parseFloat(document.getElementById("fprice").value),
        quantity: parseInt(document.getElementById("fqty").value),
        gender:   document.getElementById("fgender").value,
      }),
    });
    e.target.reset(); closeAddForm(); loadInventory();
  });

  /* ─── Product detail modal ─── */
  function openProduct(id) {
    const item = allItems.find(i => i._id === id);
    if (!item) return;
    document.getElementById("detailBrand").textContent = item.brand;
    document.getElementById("detailName").textContent  = item.name;
    document.getElementById("detailPrice").textContent = "$" + parseFloat(item.price).toFixed(2);
    document.getElementById("detailSize").textContent  = item.size;
    document.getElementById("detailColor").textContent  = item.color;
    document.getElementById("detailGender").textContent = item.gender || "—";
    document.getElementById("detailStock").innerHTML    = qtyBadge(item.quantity);
    document.getElementById("detailImgCol").innerHTML  = item.image
      ? `<img src="${escHtml(item.image)}" alt="${escHtml(item.name)}" onerror="this.parentElement.innerHTML='<div class=\\'detail-img-ph\\'><i class=\\'bi bi-image\\'></i></div>'">`
      : `<div class="detail-img-ph"><i class="bi bi-image"></i></div>`;
    document.getElementById("detailEditBtn").onclick = () => { productModal.hide(); openEdit(item._id, item.quantity); };
    document.getElementById("detailDelBtn").onclick  = () => { productModal.hide(); deleteItem(item._id); };
    productModal.show();
  }

  /* ─── Edit qty ─── */
  function openEdit(id, qty) { editingId=id; document.getElementById("newQty").value=qty; editModal.show(); }
  async function saveQty() {
    await fetch(`${API}/inventory/${editingId}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({quantity:parseInt(document.getElementById("newQty").value)})});
    editModal.hide(); loadInventory();
  }

  /* ─── Delete ─── */
  async function deleteItem(id) {
    if (!confirm("Remove this item?")) return;
    await fetch(`${API}/inventory/${id}`,{method:"DELETE"}); loadInventory();
  }

  /* ─── Filter section toggle ─── */
  function toggleSection(header) {
    header.classList.toggle("open");
    const body = header.nextElementSibling;
    body.style.display = header.classList.contains("open") ? "" : "none";
  }

  /* ─── XSS guard ─── */
  function escHtml(str) { return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  loadInventory();
</script>
</body>
</html>
